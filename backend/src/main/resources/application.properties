spring.config.import=optional:file:.env[.properties]
spring.application.name=opsflow
server.port=${SERVER_PORT:4040}

# Aiven PostgreSQL connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${AIVEN_PG_HOST:localhost}:${AIVEN_PG_PORT:5432}/${AIVEN_PG_DATABASE:opsflow}?sslmode=require}
spring.datasource.username=${AIVEN_PG_USER:postgres}
spring.datasource.password=${AIVEN_PG_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate validates migrated schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
app.cors.allowed-methods=${ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
